apis:
- aid: springer-nature:springer-nature-metadata-api
  name: Springer Nature Metadata API
  description: >-
    The legacy Metadata API provides metadata retrieval for Springer publications. Returns article and
    book metadata via DOI, journal name, ISSN, or keyword. Predecessor to the Meta API with slightly different
    response structure.
  humanURL: https://dev.springernature.com/docs/api-endpoints/metadata-api/
  baseURL: https://api.springernature.com
