    url: https://dev.springernature.com/docs/api-endpoints/metadata-api/
- aid: springer-nature:springer-nature-fulltext-api
  name: Springer Nature Full Text API
  description: >-
    Premium full-text API providing content retrieval for licensed Springer Nature publications including
    text and data mining (TDM) capabilities. Requires institutional or premium API access. Returns XML
    and HTML article content.
  humanURL: https://dev.springernature.com/docs/api-endpoints/fulltext-api/
